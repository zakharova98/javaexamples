name: Java CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  # =========================
  # 1. Unit tests
  # =========================
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn clean test


  # =========================
  # 2. Build JAR
  # =========================
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: target/*.jar


  # =========================
  # 3. Docker
  # =========================
  docker:
    name: Build and run Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: target

      - name: Build Docker image
        run: |
          docker build \
            -t javaexamples:${{ github.sha }} \
            -t javaexamples:latest \
            .

      - name: Run Docker container
        run: |
          docker run -d \
            --name javaexamples \
            javaexamples:${{ github.sha }}

      - name: Show container logs
        run: docker logs javaexamples

      - name: Check container is running
        run: |
          sleep 5
          docker ps -a
          docker inspect javaexamples --format='{{.State.Status}}'

      - name: Stop container
        if: always()
        run: docker stop javaexamples || true
